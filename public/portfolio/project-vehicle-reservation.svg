<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>On-Demand Vehicle Reservation Framework</title>
<rect width="800" height="500" fill="#0a0a0a"/>
<rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#262626" stroke-width="1"/>

<text x="40" y="46" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#737373">// ARCH_DIAGRAM_03</text>
<text x="40" y="72" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#f5f5f5">VEHICLE RESERVATION FRAMEWORK</text>

<!-- Request node -->
<rect x="40" y="150" width="140" height="60" rx="2" fill="#141414" stroke="#262626" stroke-width="1"/>
<text x="110" y="175" font-family="ui-monospace, monospace" font-size="12" fill="#f5f5f5" text-anchor="middle">USER REQUEST</text>
<text x="110" y="192" font-family="ui-monospace, monospace" font-size="10" fill="#737373" text-anchor="middle">Date / Location</text>

<!-- Availability engine -->
<rect x="330" y="150" width="150" height="60" rx="2" fill="#141414" stroke="#aaff00" stroke-width="1"/>
<text x="405" y="175" font-family="ui-monospace, monospace" font-size="12" fill="#aaff00" text-anchor="middle">AVAILABILITY ENGINE</text>
<text x="405" y="192" font-family="ui-monospace, monospace" font-size="10" fill="#737373" text-anchor="middle">Real-time lock</text>

<!-- Fleet DB -->
<rect x="620" y="150" width="140" height="60" rx="2" fill="#141414" stroke="#262626" stroke-width="1"/>
<text x="690" y="175" font-family="ui-monospace, monospace" font-size="12" fill="#f5f5f5" text-anchor="middle">FLEET DB</text>
<text x="690" y="192" font-family="ui-monospace, monospace" font-size="10" fill="#737373" text-anchor="middle">Vehicle status</text>

<!-- Payment -->
<rect x="330" y="300" width="150" height="60" rx="2" fill="#141414" stroke="#262626" stroke-width="1"/>
<text x="405" y="325" font-family="ui-monospace, monospace" font-size="12" fill="#f5f5f5" text-anchor="middle">PAYMENT GATEWAY</text>
<text x="405" y="342" font-family="ui-monospace, monospace" font-size="10" fill="#737373" text-anchor="middle">Stripe / Escrow</text>

<!-- Confirmation -->
<rect x="620" y="300" width="140" height="60" rx="2" fill="#141414" stroke="#262626" stroke-width="1"/>
<text x="690" y="325" font-family="ui-monospace, monospace" font-size="12" fill="#f5f5f5" text-anchor="middle">CONFIRMATION</text>
<text x="690" y="342" font-family="ui-monospace, monospace" font-size="10" fill="#737373" text-anchor="middle">SMS / Email</text>

<!-- Connectors -->
<line x1="180" y1="180" x2="330" y2="180" stroke="#262626" stroke-width="1"/>
<line x1="480" y1="180" x2="620" y2="180" stroke="#262626" stroke-width="1"/>
<line x1="405" y1="210" x2="405" y2="300" stroke="#262626" stroke-width="1"/>
<line x1="480" y1="330" x2="620" y2="330" stroke="#262626" stroke-width="1"/>
<line x1="690" y1="210" x2="690" y2="300" stroke="#262626" stroke-width="1" stroke-dasharray="3 3"/>

<text x="40" y="460" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1" fill="#737373">PRODUCT DEVELOPMENT</text>
<text x="760" y="460" font-family="ui-monospace, monospace" font-size="10" fill="#737373" text-anchor="end">2026</text>
</svg>
